[package]
name = "clipforge-native"
version = "1.0.0"
edition = "2021"
description = "ClipForge — True Native Rust egui/wgpu AI Video Editor & Offline Media Studio"

[[bin]]
name = "ClipForgeNative"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
base64 = "0.22"
urlencoding = "2.1"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
