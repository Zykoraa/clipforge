name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            binary_path: dist/ClipForge/ClipForge.exe
            native_path: dist/ClipForge/ClipForgeNative.exe
            artifact_paths: |
              dist/ClipForge-windows-*.zip
              dist/ClipForge-Setup-windows-*.exe
          - name: Linux (x86_64)
            os: ubuntu-24.04
            binary_path: dist/ClipForge/ClipForge
            native_path: dist/ClipForge/ClipForgeNative
            artifact_paths: dist/ClipForge-linux-*.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install FFmpeg, fonts & native UI build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-liberation fonts-dejavu-core \
            pkg-config libasound2-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          refreshenv

      - name: Sync dependencies (including PyInstaller build extra)
        run: uv sync --extra build

      - name: Run E2E & security test suite
        run: uv run pytest -v tests/test_clipforge_e2e.py

      - name: Install Rust toolchain (for release builds)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipforge-native

      - name: Build Native Rust UI + standalone backend & archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: uv run python build_exe.py --build-native --archive

      - name: Build Windows Setup Installer (.exe)
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) } else { $ver = "1.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          & $iscc "/DAppVersion=$ver" "installer\ClipForge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test compiled binaries
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test -f "${{ matrix.native_path }}"
          "${{ matrix.binary_path }}" --help

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-${{ runner.os }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform archives & installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
