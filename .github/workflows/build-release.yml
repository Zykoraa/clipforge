name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            artifact_pattern: dist/ClipForge-windows-*.zip
            binary_path: dist/ClipForge/ClipForge.exe
          - name: Linux (x86_64)
            os: ubuntu-22.04
            artifact_pattern: dist/ClipForge-linux-*.tar.gz
            binary_path: dist/ClipForge/ClipForge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install FFmpeg & fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-liberation fonts-dejavu-core

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          refreshenv

      - name: Sync dependencies (including PyInstaller build extra)
        run: uv sync --extra build

      - name: Run E2E & security test suite
        run: uv run pytest -v tests/test_clipforge_e2e.py

      - name: Build standalone bundle & archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: uv run python build_exe.py --archive

      - name: Smoke-test compiled binary
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: "${{ matrix.binary_path }}" --help

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-${{ runner.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
