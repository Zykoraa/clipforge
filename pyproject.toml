[project]
name = "clipforge"
version = "0.1.0"
description = "AI-Controllable Non-Linear Video Editor & MCP Server with Smart Stitching and Auto-Subtitling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "faster-whisper>=1.2.1",
    "filelock>=4.1.0",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.4.9",
    "mcp[cli]>=2.3.0",
    "onnxruntime<1.24",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
]
cuda = [
    "nvidia-cublas-cu12>=12.4.5.8; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.scripts]
clipforge-mcp = "clipforge.mcp_server:main"
clipforge-ui = "clipforge.web_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
